<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Grateful Dead Steal Your Face placeholder">
  <defs>
    <radialGradient id="cosmos" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1a3a" stop-opacity="1"/>
      <stop offset="55%" stop-color="#120c1c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05030a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="redglow" cx="30%" cy="40%" r="55%">
