<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="page-title">Band — Dead Shows</title>
  <meta name="description" id="page-desc" content="Upcoming Grateful Dead family / tribute shows.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💀</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>

  <section class="band-hero">
    <div class="band-hero-inner">
      <a class="back-link" href="index.html">← All shows</a>
      <div class="band-hero-grid">
        <img id="band-portrait" class="band-portrait" alt="" loading="eager">
        <div class="band-hero-text">
          <p class="tier-eyebrow" id="band-tier">Loading…</p>
          <h1 id="band-name">…</h1>
          <p class="band-blurb" id="band-blurb"></p>
          <div class="band-links" id="band-links"></div>
        </div>
      </div>
    </div>
  </section>

  <main class="shell">
    <div class="section-header">
      <div>
        <p class="section-kicker" id="result-count">Loading shows…</p>
        <h2 class="section-headline">Upcoming shows</h2>
        <p class="section-sub">Within 500 miles of King of Prussia, PA, in the next 12 months. <a href="index.html">Change search →</a></p>
      </div>
    </div>

    <div id="map" class="map" aria-label="Map of shows"></div>

    <div id="cards" class="cards" aria-live="polite">
      <div class="loading">Searching Ticketmaster</div>
    </div>
  </main>

  <footer class="footer">
    <p>Event data via Ticketmaster Discovery API.</p>
    <p class="footer-credit"><a href="https://github.com/paulrenzi/dead-shows">source on GitHub</a></p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="band.js?v=10"></script>
</body>
</html>
